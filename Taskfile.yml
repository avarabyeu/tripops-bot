# Taskfile for TripOps — https://taskfile.dev
#
# `task` with no arguments lists everything. The tasks here are the same ones
# CI runs, so "it passes locally" means something.
version: "3"

# Local configuration. Everything in .env becomes an environment variable for
# every task, which is what makes `task run` and `docker compose up` read the
# same file. Docker Compose loads it on its own.
dotenv: [".env"]

includes:
  app:
    taskfile: ./miniapp/Taskfile.yml
    dir: ./miniapp
    optional: true

vars:
  BINARY: bin/tripops
  PKG: ./...
  # A local SQLite file is the default target for every dev task: no container
  # needed to run, migrate or test. DATABASE_URL from .env wins if it is set.
  DEV_DATABASE_URL: '{{.DATABASE_URL | default "sqlite://tripops.db"}}'
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  # Port for the throwaway PostgreSQL that test:integration runs.
  TEST_PG_PORT: '{{.TEST_PG_PORT | default "55432"}}'
  # The public stack: the PostgreSQL compose file plus the untracked overlay
  # that adds the domain and the proxy labels. DEPLOY_CONTEXT comes from
  # .env.production, so which machine this deploys to is not in the repository;
  # empty means the current Docker context.
  # The server's architecture, which is not this laptop's.
  DEPLOY_PLATFORM: '{{.DEPLOY_PLATFORM | default "linux/amd64"}}'
  DEPLOY: docker ${DEPLOY_CONTEXT:+--context "$DEPLOY_CONTEXT"} compose -f docker-compose.yml -f docker-compose.deploy.yml --env-file .env.production

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # ------------------------------------------------------------------ build --

  build:
    desc: Build the tripops binary into bin/
    env:
      # Static binary: the SQLite driver is pure Go, so the result runs in a
      # scratch container. Deliberately not set globally — `go test -race`
      # needs cgo on Linux, and a global setting silently broke it in CI.
      CGO_ENABLED: "0"
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BINARY}}"
    cmds:
      - go build -trimpath -ldflags "-s -w -X github.com/avarabyeu/tripops-bot/internal/cli.version={{.VERSION}}" -o {{.BINARY}} ./cmd/tripops

  run:
    desc: Run the backend against the local SQLite database
    deps: [build]
    env:
      DATABASE_URL: "{{.DEV_DATABASE_URL}}"
    cmds:
      - ./{{.BINARY}} serve

  dev:
    desc: Run the backend and the Mini App dev server together
    deps: [run, app:dev]

  # -------------------------------------------------------------------- test --

  test:
    desc: Run the whole test suite (unit + integration, on SQLite)
    cmds:
      - go test -race -count=1 {{.PKG}}

  test:unit:
    desc: Run only the fast domain tests
    cmds:
      - go test -race -count=1 ./internal/...

  test:integration:
    desc: Run the integration suite against PostgreSQL, the engine production is not
    cmds:
      # The suite runs on SQLite everywhere else; this proves the schema and
      # every repository work on PostgreSQL too. The container is this task's
      # own, so there is nothing to start or clean up by hand.
      - |
        set -e
        name=tripops-test-pg
        cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
        trap cleanup EXIT
        cleanup
        docker run -d --name "$name" -e POSTGRES_USER=tripops \
          -e POSTGRES_PASSWORD=tripops -e POSTGRES_DB=tripops_test \
          -p {{.TEST_PG_PORT}}:5432 postgres:17-alpine >/dev/null
        until docker exec "$name" pg_isready -U tripops -d tripops_test >/dev/null 2>&1; do sleep 1; done
        TEST_DATABASE_URL='postgres://tripops:tripops@localhost:{{.TEST_PG_PORT}}/tripops_test?sslmode=disable' \
          go test -race -count=1 ./test/...
    silent: true

  test:cover:
    desc: Run tests and open the coverage report
    cmds:
      # -coverpkg, or the integration suite's coverage lands on a package
      # with no statements of its own and every number reads far too low.
      - go test -count=1 -coverpkg=./... -coverprofile=coverage.out -covermode=atomic {{.PKG}}
      - go tool cover -func=coverage.out | tail -1
      - go tool cover -html=coverage.out

  # ----------------------------------------------------------------- quality --

  fmt:
    desc: Format the Go sources (gofumpt + import grouping, via golangci-lint)
    cmds:
      - golangci-lint fmt
      - go mod tidy

  lint:
    desc: Check formatting and lint, if golangci-lint is installed
    cmds:
      - |
        if command -v golangci-lint >/dev/null 2>&1; then
          # fmt first: it prints the diff, which is what you actually want to
          # see. `task fmt` applies it.
          golangci-lint fmt --diff
          golangci-lint run
        else
          echo "golangci-lint is not installed — skipping format check and lint."
          echo "Install it with 'task tools'. CI always runs both."
        fi
    silent: true

  tools:
    desc: Install the development tools
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - task: hooks

  hooks:
    desc: Point git at .githooks, so commits are format-checked first
    cmds:
      - git config core.hooksPath .githooks
      - echo "git hooks enabled — pre-commit checks formatting"
    silent: true

  check:
    desc: Everything CI runs — format check, lint, vet, tests, build
    cmds:
      - task: lint
      # Always runs, even where golangci-lint is not installed.
      - go vet ./...
      - task: test
      - task: build

  # -------------------------------------------------------------- migrations --

  migrate:up:
    desc: Apply pending migrations
    deps: [build]
    env:
      DATABASE_URL: "{{.DEV_DATABASE_URL}}"
    cmds:
      - ./{{.BINARY}} migrate up

  migrate:status:
    desc: Show the schema version and what is pending
    deps: [build]
    env:
      DATABASE_URL: "{{.DEV_DATABASE_URL}}"
    cmds:
      - ./{{.BINARY}} migrate status

  migrate:new:
    desc: Create a new migration pair — task migrate:new -- add_trip_notes
    cmds:
      - |
        name='{{.CLI_ARGS}}'
        if [ -z "$name" ]; then echo "usage: task migrate:new -- add_trip_notes"; exit 1; fi
        next=$(printf '%06d' $(( $(ls migrations/sql/*.up.sql 2>/dev/null | wc -l | tr -d ' ') + 1 )))
        for direction in up down; do
          file="migrations/sql/${next}_${name}.${direction}.sql"
          printf -- "-- %s_%s (%s)\n\n" "$next" "$name" "$direction" > "$file"
          echo "created $file"
        done
    silent: true

  db:reset:
    desc: Delete the local SQLite database and migrate from scratch
    cmds:
      - rm -f tripops.db tripops.db-shm tripops.db-wal
      - task: migrate:up

  # ------------------------------------------------------------------ docker --

  docker:up:
    desc: Start the default stack (backend on SQLite + Mini App)
    cmds:
      - docker compose up --build -d
      - docker compose ps

  docker:down:
    desc: Stop the default stack
    cmds:
      - docker compose down

  docker:logs:
    desc: Follow the backend logs of the default stack
    cmds:
      - docker compose logs -f backend

  # -------------------------------------------------------------- deployment --
  # These read docker-compose.deploy.yml and .env.production, neither of which
  # is in the repository: see docker-compose.deploy.yml.example.

  deploy:build:
    dotenv: [".env.production"]
    desc: Cross-build the production images locally for the server's architecture
    env:
      # Keeps the result a plain image rather than a manifest index, so
      # `docker save`/`load` stays simple.
      BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
    cmds:
      # bake reads the build definitions out of docker-compose.yml, so there is
      # no second copy of them here, and it builds both images in parallel.
      - |
        docker buildx bake -f docker-compose.yml \
          --set '*.platform={{.DEPLOY_PLATFORM}}' \
          --set 'backend.args.VERSION={{.VERSION}}' \
          --load

  deploy:ship:
    dotenv: [".env.production"]
    desc: Send the locally built images to the server over SSH
    preconditions:
      - sh: docker image inspect tripops-backend:latest >/dev/null 2>&1
        msg: "no image to ship — run `task deploy:build` first"
      # `task docker:up` builds the same tags for this laptop's architecture,
      # so without this check a local run silently replaces the cross-built
      # image and ships something the server cannot execute.
      - sh: |
          want=$(echo '{{.DEPLOY_PLATFORM}}' | cut -d/ -f2)
          for image in tripops-backend:latest tripops-miniapp:latest; do
            docker image inspect "$image" | grep -q "\"Architecture\": \"$want\"" || exit 1
          done
        msg: "the local images are not built for {{.DEPLOY_PLATFORM}} — run `task deploy:build` again (a local `task docker:up` overwrites these tags)"
    cmds:
      # The server has one CPU and a gigabyte of RAM; it is not going to build
      # anything. gzip because this goes over SSH.
      - |
        set -e
        docker save tripops-backend:latest tripops-miniapp:latest \
          | gzip \
          | docker ${DEPLOY_CONTEXT:+--context "$DEPLOY_CONTEXT"} load
        # Each deploy orphans the previous image, and disk is as tight as
        # everything else on that box.
        docker ${DEPLOY_CONTEXT:+--context "$DEPLOY_CONTEXT"} image prune -f
    silent: true

  deploy:release:
    desc: Build locally, ship to the server, restart the stack — the usual path
    cmds:
      - task: deploy:build
      - task: deploy:ship
      - task: deploy:up

  deploy:up:
    dotenv: [".env.production"]
    desc: Start the public stack (backend on SQLite + Mini App behind Traefik)
    preconditions:
      - sh: test -f docker-compose.deploy.yml
        msg: "docker-compose.deploy.yml is missing — copy docker-compose.deploy.yml.example and edit it"
      - sh: test -f .env.production
        msg: ".env.production is missing — copy .env.example and fill it in"
    cmds:
      # No --build: the images are built on a developer machine and loaded in
      # by `task deploy:ship`.
      - "{{.DEPLOY}} up -d"
      - "{{.DEPLOY}} ps"

  deploy:down:
    dotenv: [".env.production"]
    desc: Stop the public stack
    cmds:
      - "{{.DEPLOY}} down"

  deploy:logs:
    dotenv: [".env.production"]
    desc: Follow the public stack's backend logs
    cmds:
      - "{{.DEPLOY}} logs -f backend"

  deploy:backup:
    dotenv: [".env.production"]
    desc: Take a consistent snapshot of the deployed database and copy it here
    cmds:
      # VACUUM INTO rather than a file copy: safe while the app is serving.
      # The bind-mounted directory is the single point of failure, and this is
      # what gets a copy off the host.
      - |
        set -e
        stamp=$(date -u +%Y%m%dT%H%M%SZ)
        out="tripops-$stamp.db"
        # Streamed rather than written and copied out: the runtime image has no
        # shell, so there would be nothing to delete the leftover file with.
        {{.DEPLOY}} exec -T backend /usr/local/bin/tripops db backup --stdout > "$out"
        echo "saved $out ($(du -h "$out" | cut -f1))"
    silent: true

  deploy:webhook:
    dotenv: [".env.production"]
    desc: Point Telegram at the deployed backend
    cmds:
      - "{{.DEPLOY}} exec backend /usr/local/bin/tripops bot set-webhook"

  # --------------------------------------------------------------- telegram --

  clean:
    desc: Remove build output and local databases
    cmds:
      - rm -rf bin coverage.out tripops.db tripops.db-shm tripops.db-wal

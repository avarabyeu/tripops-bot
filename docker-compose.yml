# The default stack: the backend on SQLite, plus the Mini App behind nginx.
#
#   docker compose up --build
#
# No database server. The whole trip lives in one file on a named volume,
# which is enough for a group of friends and makes the stack two containers
# instead of three. For PostgreSQL use docker-compose-pg.yml.
#
# Copy .env.example to .env and set TELEGRAM_BOT_TOKEN first. Without a token
# everything still runs; the bot and notifications are simply disabled.

services:
  backend:
    # Named so `docker buildx bake` has a tag to apply and so the deployed
    # stack can resolve an image that was built elsewhere and loaded in.
    image: tripops-backend:latest
    build:
      context: .
      args:
        VERSION: ${VERSION:-compose}
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: "8080"
      # /data exists in the image, owned by the nonroot user the container runs
      # as, so the named volume below inherits that ownership when Docker
      # creates it.
      DATABASE_URL: sqlite:///data/tripops.db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_MODE: ${TELEGRAM_BOT_MODE:-polling}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      MINIAPP_URL: ${MINIAPP_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-EUR}
      DEV_USER_TELEGRAM_ID: ${DEV_USER_TELEGRAM_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - sqlite-data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      # The image has no shell and no curl, so the binary probes itself.
      test: ["CMD", "/usr/local/bin/tripops", "migrate", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  miniapp:
    image: tripops-miniapp:latest
    build:
      context: ./miniapp
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  sqlite-data:

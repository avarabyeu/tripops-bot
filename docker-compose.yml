# The default stack: one container.
#
#   docker compose up --build
#
# The Mini App is compiled into the binary, so the image that serves the API
# serves the app too — same origin, no proxy, nothing to keep in step. No
# database server either: the whole trip lives in one file on a named volume,
# which is enough for a group of friends. For PostgreSQL use
# docker-compose-pg.yml.
#
# Copy .env.example to .env and set TELEGRAM_BOT_TOKEN first. Without a token
# everything still runs; the bot and notifications are simply disabled.

services:
  backend:
    # Named so `docker buildx bake` has a tag to apply and so the deployed
    # stack can resolve an image that was built elsewhere and loaded in.
    image: tripops-backend:latest
    build:
      context: .
      args:
        VERSION: ${VERSION:-compose}
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: "8080"
      # /data exists in the image, owned by the nonroot user the container runs
      # as, so the named volume below inherits that ownership when Docker
      # creates it.
      DATABASE_URL: sqlite:///data/tripops.db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_MODE: ${TELEGRAM_BOT_MODE:-polling}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      MINIAPP_URL: ${MINIAPP_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-EUR}
      # Tunables. The defaults here match the ones in internal/config, so the
      # behaviour is unchanged — but without these lines, setting any of them
      # in an env file does nothing at all, silently, which is worse than not
      # offering the knob.
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      TELEGRAM_INITDATA_TTL: ${TELEGRAM_INITDATA_TTL:-24h}
      SCHEDULER_INTERVAL: ${SCHEDULER_INTERVAL:-1m}
      NOTIFY_INTERVAL: ${NOTIFY_INTERVAL:-15s}
      DEV_USER_TELEGRAM_ID: ${DEV_USER_TELEGRAM_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - sqlite-data:/data
    ports:
      # The app and the API are both here.
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      # The image has no shell and no curl, so the binary probes itself.
      test: ["CMD", "/usr/local/bin/tripops", "migrate", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  sqlite-data:
